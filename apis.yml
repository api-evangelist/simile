aid: simile
name: Simile
description: 'Simile is a simulation platform for human behavior. Its AI-driven simulations
  show how and why customers, employees, or populations respond to change, so enterprise
  teams can find their audience, reach niche populations, de-risk decisions, segment
  sentiment at scale, and test concepts before a real-world launch. Simile is building
  a foundation model that predicts human behavior and a product that deploys it at scale.
  It raised a $100M Series A led by Index Ventures and is backed by Bain Capital Ventures;
  named customers include CVS Health, Wealthfront, Suntory, Garnett Station Partners,
  and Banco Itau.'
